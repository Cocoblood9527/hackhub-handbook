    if(h){ flushPara(); if(inList){out.push('</ul>');inList=false;} const lvl=h[1].length<=2?1:2; out.push('<h'+lvl+'>'+inline(h[2])+'</h'+lvl+'>'); continue; }
    const li=line.match(/^[-*]\s+(.*)/);
    if(li){ flushPara(); if(!inList){out.push('<ul>');inList=true;} out.push('<li>'+inline(li[1])+'</li>'); continue; }
    if(inList){ out.push('</ul>'); inList=false; }
    if(line===''){ flushPara(); continue; }
    para.push(line.trim());
  }
  flushPara(); if(inCode&&codeBuf.length) out.push('<pre class="code">'+esc(codeBuf.join('\n'))+'</pre>'); if(inList)out.push('</ul>');
  return out.join('\n');
}
const byCat = c => DATA.arts.filter(a=>a.cat===c).sort((x,y)=>x.order-y.order||x.title.localeCompare(y.title));
const catName = c => DATA.cats[c]||c;
const artTitle = id => (DATA.arts.find(a=>a.id===id)||{}).title || id;
let state = { view:'home', cat:null, art:null, search:'' };
const countN = n => DATA.ui.countN.replace('@n@', n);
const resultsN = (n,s) => DATA.ui.resultsN.replace('@n@', n).replace('@s@', s);
const noResN = s => DATA.ui.noRes.replace('@s@', s);

function renderCrumbs(){
  const c=$('crumbs');
  if(state.view==='home'){ c.innerHTML = '<b>📖 '+DATA.ui.handbook+'</b>'; }
  else if(state.view==='search'){ c.innerHTML = '<span class="lnk" onclick="navHome()">←</span> <span class="lnk" onclick="navHome()">'+DATA.ui.contents+'</span> / <b>'+esc(DATA.ui.searchBtn)+'「'+esc(state.search)+'」</b>'; }
  else { c.innerHTML = '<span class="lnk" onclick="navHome()">←</span> <span class="lnk" onclick="navHome()">'+DATA.ui.contents+'</span> / <b>'+esc(catName(state.cat))+'</b>'; }
}
function renderSidebar(){
  const s=$('sidebar');
  if(state.view==='home'||state.view==='search'){ s.innerHTML=''; s.classList.add('hidden'); return; }
  s.classList.remove('hidden');
  let h='<div class="side-head">'+esc(catName(state.cat))+'</div>';
  for(const a of byCat(state.cat)) h+='<div class="nav-item'+(a.id===state.art?' active':'')+'" onclick="openArt(\''+a.cat+'\',\''+a.id+'\')">'+esc(a.title)+'</div>';
  s.innerHTML=h;
}
function renderContent(){
  const c=$('content');
  if(state.view==='home'){
    let cards='';
    for(const cat of CAT_ORDER){ const n=byCat(cat).length;
      cards+='<div class="card" onclick="openCat(\''+cat+'\')"><div class="card-icon">'+CAT_ICONS[cat]+'</div><div><div class="card-title">'+esc(catName(cat))+'</div><div class="card-sub">'+countN(n)+'</div></div></div>'; }
    c.innerHTML='<div class="home"><div class="home-title">'+DATA.ui.contents+'</div><div class="home-sub">'+DATA.ui.sub+'</div><div class="grid">'+cards+'</div></div>';
  } else if(state.view==='cat'){
    let list='';
    for(const a of byCat(state.cat)) list+='<div class="res-item" onclick="openArt(\''+a.cat+'\',\''+a.id+'\')"><div class="res-title">'+esc(a.title)+'</div></div>';
    c.innerHTML='<div class="handbook-content"><h1>'+esc(catName(state.cat))+'</h1><p class="res-count">'+countN(byCat(state.cat).length)+'</p>'+list+'</div>';
  } else if(state.view==='search'){
    const q=state.search.toLowerCase();
    let re=null; try{ re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); }catch(e){ re=new RegExp('x^','ig'); }
    const hits=DATA.arts.map(a=>{
      const raw=DATA.content[a.id]||''; const body=unescape2(raw);
      const ti=a.title.toLowerCase().includes(q);
      const ci=body.toLowerCase().indexOf(q);
      if(!ti&&ci<0) return null;
      let ex='';
      if(ci>=0){ const start=Math.max(0,ci-40); ex=((start>0?'…':'')+body.slice(start,ci+q.length+80).replace(/<[^>]*>/g,'').replace(/[#*`\\]/g,'').replace(/\n+/g,' ')+'…'); }
      return {a, ex: esc(ex).replace(re,'<mark>$1</mark>')};
    }).filter(Boolean);
    let h='<div class="handbook-content"><h1>'+resultsN(hits.length,esc(state.search))+'</h1>';
    if(!hits.length) h+='<p class="no-sel">'+noResN(esc(state.search))+'</p>';
    for(const it of hits) h+='<div class="res-item" onclick="openArt(\''+it.a.cat+'\',\''+it.a.id+'\')"><div class="res-cat">'+esc(catName(it.a.cat))+'</div><div class="res-title">'+esc(it.a.title).replace(re,'<mark>$1</mark>')+'</div>'+(it.ex?'<div class="res-ex">'+it.ex+'</div>':'')+'</div>';
    c.innerHTML=h+'</div>';
  } else {
    let body=unescape2(DATA.content[state.art]||'');
    if(!/^\s*#{1,6}\s/.test(body)) body='<h1>'+esc(artTitle(state.art))+'</h1>\n'+body;
    c.innerHTML='<div class="handbook-content">'+md2html(body)+'</div>';
  }
  c.scrollTop=0;
}
function render(){ renderCrumbs(); renderSidebar(); renderContent();
  const want = state.view==='art' ? '#art-'+state.art : (state.view==='cat'?'#cat-'+state.cat:(state.view==='search'?'#search':'#home'));
  if(location.hash!==want){ try{ history.replaceState(null,'',want); }catch(e){ try{ location.hash=want; }catch(e2){} } }
}
function navHome(){ state={view:'home',cat:null,art:null,search:''}; render(); }
function openCat(cat){ state.view='cat'; state.cat=cat; state.art=null; render(); }
function openArt(cat,id){ state.view='art'; state.cat=cat; state.art=id; render(); }
function doSearch(){ const q=$('q').value.trim(); if(!q){ navHome(); return; } state.view='search'; state.search=q; state.cat=null; state.art=null; render(); }
$('q').placeholder=DATA.ui.searchPh; $('goSearch').textContent='🔍 '+DATA.ui.searchBtn;
$('goHome').onclick=navHome; $('goSearch').onclick=doSearch;
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });
$('q').addEventListener('input',e=>{ if(!e.target.value.trim()&&state.view==='search') navHome(); });
window.navHome=navHome; window.openCat=openCat; window.openArt=openArt;
function route(){ const h=location.hash.slice(1);
  if(h==='home'||h===''){ navHome(); return; }
  if(h==='search'){ if(state.view==='search'&&state.search) return; navHome(); return; }
  if(h.startsWith('art-')){ const id=h.slice(4); const a=DATA.arts.find(x=>x.id===id); if(a){ state={view:'art',cat:a.cat,art:id,search:''}; render(); return; } }
  if(h.startsWith('cat-')){ const c=h.slice(4); if(DATA.cats[c]){ openCat(c); return; } }
  navHome();
}
window.addEventListener('hashchange',route);
route();

</script></body></html>
