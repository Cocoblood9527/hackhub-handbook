ules","order":0,"title":"JWT Decoder"},{"id":"bf6abbce-e300-4ca0-b3fe-ae7904d372be","cat":"PythonModules","order":0,"title":"WigleNet"},{"id":"872b0296-c4fd-49b4-8e77-c1e711caf381","cat":"PythonModules","order":0,"title":"Pret"},{"id":"37e141cf-a63d-41c5-b09f-6184a867c0b6","cat":"PythonModules","order":0,"title":"Fern"},{"id":"0163784c-4ca7-4604-92cc-458968826437","cat":"PythonModules","order":0,"title":"pyUserEnum"},{"id":"ow-intro","cat":"OnlineWorld","order":0,"title":"The Online World"},{"id":"ow-recon","cat":"OnlineWorld","order":1,"title":"Finding Targets"},{"id":"ow-tiers","cat":"OnlineWorld","order":2,"title":"Targets & Tiers"},{"id":"ow-tier1","cat":"OnlineWorld","order":3,"title":"Tier 1: Direct Targets"},{"id":"ow-tier2","cat":"OnlineWorld","order":4,"title":"Tier 2: VPN-Gated Targets"},{"id":"ow-tier3","cat":"OnlineWorld","order":5,"title":"Tier 3: Vaults"},{"id":"ow-breach","cat":"OnlineWorld","order":6,"title":"Breaking In"},{"id":"ow-vpn","cat":"OnlineWorld","order":7,"title":"VPN Certificates"},{"id":"ow-keys","cat":"OnlineWorld","order":8,"title":"Keys & Decoders"},{"id":"ow-pivot","cat":"OnlineWorld","order":9,"title":"Vaults & Pivoting"},{"id":"ow-loot","cat":"OnlineWorld","order":10,"title":"Loot Packages"},{"id":"ow-appraise","cat":"OnlineWorld","order":11,"title":"Appraising Loot"},{"id":"ow-decode","cat":"OnlineWorld","order":12,"title":"Encrypted Loot"},{"id":"ow-fence","cat":"OnlineWorld","order":13,"title":"Cashing Out"},{"id":"ow-market","cat":"OnlineWorld","order":14,"title":"The GreyMarket"},{"id":"ow-heat","cat":"OnlineWorld","order":15,"title":"Heat & Hot Loot"},{"id":"ow-trace","cat":"OnlineWorld","order":16,"title":"Getting Traced"},{"id":"ow-gear","cat":"OnlineWorld","order":17,"title":"Proxies & Rigs"},{"id":"ow-hosting","cat":"OnlineWorld","order":18,"title":"Your Own Infrastructure"},{"id":"ow-egress","cat":"OnlineWorld","order":19,"title":"Working From a Rented Server"},{"id":"ow-commands","cat":"OnlineWorld","order":20,"title":"Operator Commands"}],"cats":{"Accounts":"Accounts","Digging":"Digging","Metasploit":"Metasploit","OnlineWorld":"Online World","PythonModules":"Python Modules","Scripting":"Scripting","Suspicion":"Suspicion","Terminal":"Terminal Commands"},"content":{"3ac1a925-4d24-44aa-91a9-b6dd4b9153f2":"### How to recover your account?\n\nIf you have created an account, the system automatically keeps a log of it. To see these logs, review the /logs/accounts.log file.\n\n\\`/logs/accounts.log\\`","f04d3583-aad8-401e-b7ee-b6809d3c09ba":"### How to Find User Password in Remote Connection?\n\nWhen you access a system, you may need users' passwords. Passwords are stored in an encrypted form in the operating system.\n\nThese passwords are stored in this file:\n\n\\`/etc/passwd\\`\n\nIf you want, you can decrypt this file completely or the hashes in it one by one.\n\nTo do this, a tool is required.\n\n\\`apt-get install john\\`\n\nthen\n\n\\`john <hash>\\`","91487371-f097-4203-af52-8cd201313bca":"### <span  style=\"color:lime\">Identifying the Firewall</span>\n\nBefore we begin the credential extraction procedure, we must determine the firewall’s IP address.\n\nLet’s assume the target firewall IP is **44.55.66.77**.\n\n---\n\n### <span  style=\"color:lime\">Required Tools</span>\n\nTo perform this operation, you will need the following:\n\n-  **Wireshark** – Used for monitoring network packets\n-  **Kimai Attack Script** – Downloadable from *hackdb.net*\n-  **JWT Decoder** – Also available at *hackdb.net*\n\nThese three tools work together to capture and decode authentication tokens.\n\n---\n\n### <span  style=\"color:lime\">Preparing Wireshark</span>\n\nOpen **Wireshark** and configure it for maximum visibility.\n\nIn the **Source** and **Destination** filters, enter:\n\n\\`*\\`\n\nThis allows Wireshark to capture all incoming and outgoing data without restriction.\n\nAfter setting the filter, press **Start** to begin live packet capturing.\n\nYou should now see a constant flow of traffic in the packet list.\n\n---\n\n### <span  style=\"color:lime\">Generating Traffic With Kimai</span>\n\nNext, we must generate activity toward the target firewall to force it to produce session-related data.\n\nFrom your terminal, launch the Kimai script targeting the firewall:\n\n\\`python3 ./kimai.py [ip address]\\`\n\nExample:\n\n\\`python3 ./kimai.py 44.55.66.77\\`\n\nEach execution *may* or may not result in a captured cookie.\n\nBecause of this, you must run the Kimai script repeatedly until a usable token appears in Wireshark.\n\nWhile Kimai is running, Wireshark should display a continuous stream of packets.\n\n---\n\n### <span  style=\"color:lime\">Finding the Cookie in Wireshark</span>\n\nMonitor the **Info** column in Wireshark.\n\nWhen a cookie or token appears, it will usually be displayed as a short encoded string or session reference.\n\nContinue running Kimai and monitoring the packets until a cookie-like entry becomes visible.\n\nOnce it appears, the data has been successfully captured.\n\nClick on the packet to view its detailed contents, then copy the token.\n\n---\n \n### <span  style=\"color:lime\">Decoding the Token</span>\n\nNow that you have the captured token, use the JWT Decoder tool.\n\nRun the decoder script as follows:\n\n\\`python3 ./jwt_decoder.py [token]\\`\n\nExample:\n\n\\`python3 ./jwt_decoder.py eyJhbGciOiJIUzI1NiIsInR5cCI6...\\`\n\nThe decoder will process the token and reveal its contents.\n\nAmong the decoded fields, you will find the firewall’s login credentials.\n\n---\n\n### <span  style=\"color:lime\">Conclusion</span>\n\nAt this stage:\n\n1. The firewall IP was identified\n2. Wireshark was configured to capture all traffic\n3. Kimai generated forced traffic to obtain a token\n4. A cookie was found inside Wireshark capture\n5. The token was decoded using the JWT Decoder\n6. Firewall login credentials were extracted successfully","448361de-10ba-451a-87ff-91db44f0c4dd":"### Introduction to Metasploit\n  \nMetasploit is a penetration testing tool used to detect and test security vulnerabilities.\n\n  \n\nIt is used by ethical hackers and cybersecurity professionals to identify weaknesses in systems and improve defenses.\n\n  \n\nHowever, it can also be used by malicious actors for attacks, so it should be used carefully and within legal boundaries.\n\n  \n\nInstallation\n\n\\`apt-get install metasploit\\`\n\n  \n\nUsage\n\n\\`msfconsole\\`","ad79818c-9c9b-46a5-a979-a76a1d9da245":"### How to Hack with Metasploit?\n\n  \n\nMetasploit is divided into exploits. Although the usage of each exploit is different, it works in more or less the same way.\n\n  \n\nWe cannot use Metasploit alone, we need to use some tools along with it.\n\n  \n\nFor example, we need to use **nmap** to learn which services are running on the system we want to infiltrate, which ports are active.\n\n  \n\nAccording to the results we found, if a port is open and we know the running version, we can usually infiltrate this system.\n\n  \n\nLet's get started.","ef231085-0c72-459a-8c5a-88189ee4767c":"### <span  style=\"color:lime\">Scanning the Target</span>\n\n  \n\nFor example, let's say our target's IP address is **11.22.33.44**.\n\n  \n\nWe should start our hack by scanning the target first.\n\n  \n\n\\`nmap 11.22.33.44 -sV\\`\n\n  \n\nThe result we got:\n\n  \n\n| PORT | STATE | SERVICE | VERSION | DESTINATION\n| ---- | ---- | ---- | ---- | ---- |\n| 21 | OPEN | ftp | vsftpd 2.3.5 | 192.168.1.2 |\n| 22 | CLOSE | ssh | openssh 1.8.6 | 192.168.1.2 |\n| 80 | CLOSE | http | nginx 7.23.4 | 192.168.1.2 |\n\n  \n\nFrom here we understand that port 21 is open and the service running in the background is **\"vsftpd version 2.3.5\"**.\n\n  \n\nNow we can start using metasploit.\n\n  \n\n\\`msfconsole\\`\n\n  \n\n### <span  style=\"color:lime\">Searching Exploit</span>\n\n  \n\nWe know that our target has an open port and a running service. Next, we need to find an exploit that fits it.\n\n  \n\n\\`search [running service name]\\`\n\n  \n\n**\"vsftpd 2.3.5\"** was running on our target port.\n\n  \n\nWe need to look for a suitable exploit for vsftpd.\n\n  \n\n\\`search vsftpd\\`\n\n  \n\n| # | Name | Disclosure Date | Rank | Description |\n| ---- | ---- | ---- | ---- | ---- |\n| 0 | auxiliary/dos/ftp/vsftpd | 2020-02-03 | normal | VSFTPD Denial of Service |\n\n  \n\nWe found a usable exploit. We need to test it.\n\n  \n\nIn order to use the exploit we found after searching, we need to use the **\"use\"** command.\n\n  \n\n\\`use [exploit name or index]\\`\n\n  \n\nFor this example\n\n\\`use 0\\`\n\n  \n\nOr\n\n\\`use auxiliary/dos/ftp/vsftpd\\`\n\n  \n\n### <span  style=\"color:lime\">Making Configurations</span>\n\n  \n\nWe found our exploit and used it with the **\"use\"** command.\n\n  \n\nNow we need to configure the module we are using.\n\n  \n\n\\`show options\\`\n\n  \n\nAfter using this command we displayed the current settings of the module.\n\n  \n\n| Name | Current Settings | Required | Description |\n| ---- | ---- | ---- | ---- |\n| RHOST | | yes | The target host |\n| RPORT | 21 | yes | The target host |\n| Version | 1.0.0 | yes | The target host |\n\n  \n\nWe must fill in the fields with Required = **\"yes\"**\n\n  \n\nWe fill these fields with the **\"set\"** command.\n\n  \n\n\\`set RHOST 11.22.33.44\\`\n\n  \n\n\\`set Version 2.3.5\\`\n\n  \n\nNote: Some fields may be filled by default, you should replace them with information about your target.\n\n  \n\nOnce you have filled in all the required fields you can start the attack.\n\n  \n\n### <span  style=\"color:lime\">Attacking</span>\n\n  \n\nNow that we have made all the settings, we can start the attack.\n\n  \n\nUsually this command is **\"exploit\"**. However, sometimes there may be other commands. You can learn by typing \"help\".\n\n  \n\n\\`exploit\\`\n\n  \n\nIf everything is correct you will have infiltrated the system and metasploit will give you a **meterpreter** session.","138982c6-a4fe-4271-9958-1d27aad03896":"### Rootgrab\n  \nThis metasploit tool get root password hash from passwd file.\n\nUsage (In meterpreter)\n\\`rootgrab /path/to/passwd\\`\n\nExample\n\\`rootgrab /etc/passwd\\`\n\nHint\nUsually the passwd file is located under /etc.","07d0fa4b-9c99-47d7-b347-4fd0cb4f10af":"### Metasploit Payloads\n \n You can add payloads to some Metasploit exploits. These payloads are code scripts that will run on the target system.\n\nThe most well-known is \\`bearos/meterpreter/reverse_tcp\\`\n\nUsage\n\\`set payload <payload name>\\`\n\nExample\n\\`set payload bearos/meterpreter/reverse_tcp\\`","e15ac4cc-2952-46f1-a25e-d9adb5fc0af8":"### Metasploit Reverse TCP\n \nIn some cases, most of the paths to the target system are closed, and we can't access them with our attacks. However, the target can open a way for us to enter, called Reverse TCP.\n\nThe most common way to deceive someone is through files. Seemingly harmless Word documents can carry malware that doesn't appear to be hidden.\n\nThe exploit we will use here is \\`exploit/multi/fileformat/office_word_macro\\`\n\nUsage\n- \\`search office_word_macro\\`\n- \\`use exploit/multi/fileformat/office_word_macro\\`\n- \\`set payload bearos/meterpreter/reverse_tcp\\`\n- \\`show options\\`\n- \\`set LHOST 192.168.1.2\\`\n- \\`set LPORT 4444\\`\n- \\`run (to create a malware word document)\\`\n- \\`handler (to start the listener)\\`\n- Send file to target\n\n\nWhen the connection comes\n- With *Ctrl+C* exit handler.\n- \\`show sessions\\`\n- \\`session <session index>\\`\n\n\n**Important**<br />\nHere, we've set the payload's LPORT (i.e., local port) to 4444. You can set this to any port you like. However, remember, you must open this port from the modem interface of the network you're connected to. Otherwise, the payload won't work.","db095ca3-7bbe-44f9-b765-3eb4c642011b":"### How do I create my own program?\n\nYou can automate hacking or other things by creating your own custom programs.\n\nYou can do this with the **Code++** application.\n\nHackhub supports **TypeScript** language for scripting.\n\nYou can use the default TypeScript syntax. Additionally, Hackhub has functions and libraries defined for managing the game.\n\n### Code++ Editor Features\n\n- **Tabbed editing** - Open and work on multiple files at once. Drag tabs to reorder them.\n- **Themes** - Choose from 20 color themes (Dracula, Tokyo Night, Catppuccin, etc.) in Settings.\n- **Fonts** - Pick your preferred font family and size in Settings.\n- **IntelliSense** - Full autocomplete and type checking for all built-in APIs.\n- **Import support** - Split code across files with \\`import\\`/\\`export\\` (see \"Modules & Imports\").\n\n### I wrote the code, But how do I run it?\n\nAfter writing a program, you need the \"node.js\" package to run it.\n\n\\`apt-get install node\\`\n\nThen run the typescript file you saved.\n\n\\`node /path/to/yourprogram.ts\\`\n\nYou can also press the **Play** button in Code++ to run the active file directly.","8795fb14-1f3b-43d7-8426-609617ec389f":"### Converting code to command\n\n  \n\nAfter writing a program, we run it with the \"node\" command. So how do we turn this program into a terminal command?\n\n  \n\nIf you put the code file you created into the \"lib\" folder, that file will now run as a special command.\n\n  \n\nExample:\n\n  \n\n\\`/lib/myprogram.ts\\`\n\n  \n\nIn terminal:\n\n  \n\n\\`myprogram\\`\n\n  \n\nAnother example:\n\n  \n\n\\`/lib/custom-tool.ts\\`\n\n  \n\n\\`custom-tool\\`","a2b3c4d5-e6f7-4a89-b012-c3d4e5f60123":"### Modules & Imports\n\nYou can split your code across multiple files and import/export between them using standard TypeScript syntax.\n\n### Exporting\n\nUse \\`export\\` to make functions, classes, or variables available to other scripts.\n\n\\`\\`\\`typescript\n// utils.ts\nexport function greet(name: string) {\n    println(\"Hello, \" + name + \"!\");\n}\n\nexport const VERSION = \"1.0\";\n\nexport async function doWork() {\n    println(\"Working...\");\n    await sleep(1000);\n    println(\"Done.\");\n}\n\\`\\`\\`\n\n### Importing\n\nUse \\`import\\` to bring in exports from another file. Paths are relative to the current file.\n\n\\`\\`\\`typescript\n// main.ts\nimport { greet, VERSION, doWork } from \"./utils\";\n\ngreet(\"World\");\nprintln(\"Version: \" + VERSION);\nawait doWork();\n\\`\\`\\`\n\n### How It Works\n\n- Paths are relative to the importing file: \\`\"./utils\"\\` is a sibling, \\`\"./lib/http\"\\` sits in a subfolder and \\`\"../utils/buzz\"\\` is one folder up.\n- The \\`.ts\\` extension is optional - \\`\"./utils\"\\` and \\`\"./utils.ts\"\\` both work.\n- A folder is a module of its own when it holds an \\`index.ts\\`, so \\`\"../utils\"\\` reads \\`../utils/index.ts\\`.\n- All built-in functions (\\`println\\`, \\`sleep\\`, \\`prompt\\`, \\`Shell\\`, \\`Networking\\`, etc.) work inside imported modules.\n- Imports are resolved recursively - imported files can import other files.\n\n### Folders With An Index File\n\nAn \\`index.ts\\` lets a folder decide what it hands out, and the files importing it stop caring how it is arranged inside.\n\n\\`\\`\\`typescript\n// utils/index.ts\nexport { fizz } from \"./fizz\";\nexport { buzz } from \"./buzz\";\n\\`\\`\\`\n\n\\`\\`\\`typescript\n// scripts/main.ts\nimport { fizz, buzz } from \"../utils\";\n\nprintln(fizz() + buzz());\n\\`\\`\\`\n\n### Multi-File Project Example\n\n\\`\\`\\`typescript\n// scanner.ts\nexport async function scanTarget(ip: string) {\n    const subnet = await Networking.GetSubnet(ip);\n    if (!subnet) throw \"No subnet found!\";\n    const ports = await subnet.GetPorts();\n    return ports;\n}\n\\`\\`\\`\n\n\\`\\`\\`typescript\n// main.ts\nimport { scanTarget } from \"./scanner\";\n\nconst ip = await prompt(\"Target IP: \");\nconst ports = await scanTarget(ip);\nprintln(\"Open ports: \" + ports.join(\", \"));\n\\`\\`\\`\n\n### Type Support\n\nThe Code++ editor provides full IntelliSense for imports, wherever the file lives. When you type \\`import { } from \"./file\"\\`, the editor autocompletes the symbols that file exports, and the same works for a file in another folder or a folder with an \\`index.ts\\`.","f6fb36b6-e9a2-4b6e-b32f-5e8ed283d93c":"### Lib - System\n\nBasic I/O functions for your scripts.\n\n### Printing Output\n\n\\`\\`\\`typescript\nprintln(\"Hello World!\");\nprintln(42);\n\\`\\`\\`\n\n### Colored Output\n\n\\`\\`\\`typescript\nprintln({ text: \"Success!\", color: \"green\" });\nprintln({ text: \"Error!\", color: \"red\", backgroundColor: \"#333\" });\n\\`\\`\\`\n\n### Inline Colored Text\n\n\\`\\`\\`typescript\nprintln([\n  { text: \"Status: \", color: \"white\" },\n  { text: \"OK\", color: \"green\" }\n]);\n\\`\\`\\`\n\n### Print Table\n\nDisplay data in a formatted ASCII table.\n\n\\`\\`\\`typescript\nprintTable([\n  { Name: \"SSH\", Port: 22, Status: \"open\" },\n  { Name: \"HTTP\", Port: 80, Status: \"closed\" }\n]);\n\\`\\`\\`\n\n### New Line\n\n\\`\\`\\`typescript\nnewLine();\n\\`\\`\\`\n\n### User Input\n\n\\`\\`\\`typescript\nconst ip = await prompt(\"IP Address: \");\nprintln(\\`You entered: \\${ip}\\`);\n\\`\\`\\`\n\n### Password Input (hidden)\n\n\\`\\`\\`typescript\nconst pass = await prompt({ label: \"Password: \", password: true });\n\\`\\`\\`","3c0b4c9c-eeb7-4657-9025-de5543afea1f":"### Lib - Shell\n\nManage the terminal from your scripts.\n\n### Terminal Lock\n\nLock terminal input during long operations.\n\n\\`\\`\\`typescript\nawait Shell.lock();     // Locks input\nawait Shell.unlock();   // Unlocks input\nawait Shell.isLocked(); // -> boolean\n\\`\\`\\`\n\n### Clear Terminal\n\n\\`\\`\\`typescript\nawait Shell.clear();\n\\`\\`\\`\n\n### Arguments\n\nGet command-line arguments passed to your script.\n\nExample: \\`myprogram -ip 192.168.1.1 -port 21\\`\n\n\\`\\`\\`typescript\nconst args = Shell.GetArgs();\n// -> [\"-ip\", \"192.168.1.1\", \"-port\", \"21\"]\n\\`\\`\\`\n\n### Execute Commands\n\nRun terminal commands from your script.\n\n\\`\\`\\`typescript\nawait Shell.Process.exec(\"nmap 192.168.1.1 -sV\");\n\\`\\`\\`\n\nWith working directory options:\n\n\\`\\`\\`typescript\n// Run in a specific subdirectory\nawait Shell.Process.exec(\"cat passwords.txt\", {\n  cwd: \"documents\"\n});\n\n// Run with absolute path\nawait Shell.Process.exec(\"ls\", {\n  cwd: \"/home/user/desktop\",\n  absolute: true\n});\n\\`\\`\\`\n\n### Reading Output\n\nexec() returns the command's output as text, so your script can use it.\n\n\\`\\`\\`typescript\nconst output = await Shell.Process.exec(\"nslookup freshfoods.com\");\nconst ip = output.match(/\\\\d+\\\\.\\\\d+\\\\.\\\\d+\\\\.\\\\d+/)?.[0];\nprintln(\\`IP Address: \\${ip}\\`);\n\\`\\`\\`\n\nUse \\`silent\\` when you only want the value and not the output on screen.\n\n\\`\\`\\`typescript\nconst output = await Shell.Process.exec(\"nslookup freshfoods.com\", {\n  silent: true\n});\n\\`\\`\\`","784adb54-8bca-4d3b-abcb-81835be2844d":"### Lib - Packages\n\n  \n\nTo check if a package is installed\n\n  \n\n\\`\\`\\`typescript\ncheckLib(packageName: string) -> Promise<boolean>\n\\`\\`\\`\n\n  \n\nExample\n\n  \n\n\\`\\`\\`typescript\nawait checkLib(\"lynx\")\n\\`\\`\\`\n\n  \n\nReturns true if package installed, and false for not installed.\n\n  \n\n### Installing Package\n\n  \n\n\\`\\`\\`typescript\ninstallLib(packageName: string) -> Promise<boolean>\n\\`\\`\\`\n\n  \n\nExample\n\n  \n\n\\`\\`\\`typescript\nconst  isInstalled = await  installLib(\"lynx\");\nprintln(isInstalled); // Returns true or false.\n\\`\\`\\`","3648e643-6494-49de-a856-5094374068de":"### Lib - Debug\\n\\nYou can use the game\\'s developer console to log your output. Use the \"F1\" key to do this.\\n\\n```typescript\\nDebug.Log(\"Hello World!\");\\n```\\n\\n```typescript\\nDebug.Error(\"This is error!\");\\n```","61984913-c5da-45a5-a773-ad8a5ffd2b27":"### Lib - Thread\n\nUsed for thread operations.\n\n### To wait\n\n\\`\\`\\`typescript\nsleep(timeout: number (ms)) -> Promise<void>\n\\`\\`\\`\n\n\\`\\`\\`typescript\nprintln(\"Loading...\");\nawait sleep(2500); // Waits 2.5 seconds\nprintln(\"Done.\");\n\\`\\`\\`","9eceaec2-f853-4533-9b85-bd1d0d86a050":"### Lib - File System\n\nManage files and directories on the computer.\n\nMost methods accept an optional \\`options\\` parameter:\n- \\`absolute\\` - resolve path from root instead of current directory\n- \\`recursive\\` - create intermediate directories automatically (Mkdir, WriteFile)\n\n### Current Working Directory\n\n\\`\\`\\`typescript\nconst info = await FileSystem.cwd();\nprintln(info.name);          // \"desktop\"\nprintln(info.currentPath);    // \"desktop\"\nprintln(info.absolutePath);   // \"/home/user/desktop\"\n\\`\\`\\`\n\n### Navigate Directories\n\n\\`\\`\\`typescript\nawait FileSystem.SetPath(\"documents\");\nawait FileSystem.SetPath(\"/home/user\", { absolute: true });\n\\`\\`\\`\n\n### List Files\n\n\\`\\`\\`typescript\nconst files = await FileSystem.ReadDir(\".\");\nif (!files) throw \"Cannot access directory!\";\nfor (const file of files) {\n  println(\\`\\${file.name} - \\${file.isFolder ? \"folder\" : file.extension}\\`);\n}\n\\`\\`\\`\n\n### Read File\n\n\\`\\`\\`typescript\nconst content = await FileSystem.ReadFile(\"notes.txt\");\nprintln(content);\n\\`\\`\\`\n\n### Write File\n\nCreates a new file or overwrites an existing one.\n\n\\`\\`\\`typescript\nawait FileSystem.WriteFile(\"output.txt\", \"Hello World!\");\n\n// Auto-create parent directories\nawait FileSystem.WriteFile(\"deep/path/file.txt\", data, {\n  recursive: true\n});\n\\`\\`\\`\n\n### Create Directory\n\n\\`\\`\\`typescript\nawait FileSystem.Mkdir(\"my-folder\");\nawait FileSystem.Mkdir(\"path/to/folder\", { recursive: true });\n\\`\\`\\`\n\n### Delete File or Folder\n\n\\`\\`\\`typescript\nawait FileSystem.Remove(\"old-file.txt\");\n\\`\\`\\`","b7e4f2a1-3d8c-4e56-9f12-a1b2c3d4e5f6":"### Lib - Networking\n\nNetwork operations and subnet analysis.\n\n### Validate IP Address\n\n\\`\\`\\`typescript\nawait Networking.IsIp(\"192.168.1.1\"); // true\nawait Networking.IsIp(\"abc\");         // false\n\\`\\`\\`\n\n### Get Subnet\n\n\\`\\`\\`typescript\nconst subnet = await Networking.GetSubnet(\"11.22.33.44\");\nif (!subnet) throw \"Subnet not found!\";\nprintln(subnet.ip);    // \"11.22.33.44\"\nprintln(subnet.lanIp); // \"192.168.1.2\"\n\\`\\`\\`\n\n### Subnet Methods\n\n\\`\\`\\`typescript\nconst subnet = await Networking.GetSubnet(ip);\n\n// Get the router of this subnet\nconst router = await subnet.GetRouter();\n\n// List open port numbers\nconst ports = await subnet.GetPorts(); // -> number[]\n\n// Check if a specific port is open\nconst isOpen = await subnet.PingPort(22); // -> boolean\n\n// Get detailed port information\nconst portData = await subnet.GetPortData(22);\nif (portData) {\n  println(portData.service);  // \"ssh\"\n  println(portData.version);  // \"OpenSSH 8.2\"\n  println(portData.external); // 22\n  println(portData.internal); // 22\n  println(portData.target);   // \"192.168.1.2\"\n}\n\\`\\`\\`","c8f503b2-4e9d-5f67-a023-b2c3d4e5f607":"### Lib - Networking.Wifi\n\nWireless network scanning and attack tools (similar to Bettercap).\n\n### List Interfaces\n\n\\`\\`\\`typescript\nconst interfaces = await Networking.Wifi.GetInterfaces();\nfor (const iface of interfaces) {\n  println(\\`\\${iface.name} - monitor: \\${iface.monitor}\\`);\n}\n// wlan0 - monitor: true\n// wlan1 - monitor: false\n\\`\\`\\`\n\n### Scan Networks\n\nRequires a monitor-mode capable interface (e.g. \\`wlan0\\`).\n\n\\`\\`\\`typescript\nconst networks = await Networking.Wifi.Scan(\"wlan0\");\nfor (const ap of networks) {\n  println(\\`\\${ap.ssid} | \\${ap.bssid} | Ch:\\${ap.channel} | Signal:\\${ap.signal}\\`);\n}\n\\`\\`\\`\n\n### Deauthentication Attack\n\nSend deauth frames to disconnect clients from an access point.\n\n\\`\\`\\`typescript\nawait Networking.Wifi.Deauth(\"wlan0\", targetBssid);\n\n// With custom packet count\nawait Networking.Wifi.Deauth(\"wlan0\", targetBssid, { packets: 10 });\n\\`\\`\\`\n\n### Capture WPA Handshake\n\nCaptures the WPA handshake and saves it as a \\`.pcap\\` file in the current directory.\n\n\\`\\`\\`typescript\nconst pcapFile = await Networking.Wifi.CaptureHandshake(\"wlan0\", bssid);\nprintln(\\`Saved: \\${pcapFile}\\`); // \"networkname.pcap\"\n\\`\\`\\`\n\n### Full Example - Wi-Fi Cracker\n\n\\`\\`\\`typescript\nconst ifaces = await Networking.Wifi.GetInterfaces();\nconst mon = ifaces.find(i => i.monitor);\n\nconst networks = await Networking.Wifi.Scan(mon.name);\nconst target = networks[0];\n\nawait Networking.Wifi.Deauth(mon.name, target.bssid);\nconst pcap = await Networking.Wifi.CaptureHandshake(mon.name, target.bssid);\n\nconst password = await Crypto.Hashcat.Decrypt(pcap);\nprintln(\\`Password: \\${password}\\`);\n\nawait Networking.Wifi.Connect(target.bssid, password);\n\\`\\`\\`\n\n### Connect\n\nJoins an access point by SSID or BSSID. Throws when the target cannot be found, when several networks share the same SSID, or when the passphrase is rejected.\n\n\\`\\`\\`typescript\nawait Networking.Wifi.Connect(\"HOME_5Ghz\", \"letmein123\");\n\n// Leave the passphrase out and you are asked for it on the terminal (masked input)\nawait Networking.Wifi.Connect(target.bssid);\n\\`\\`\\`\n\n### Current Connection\n\n\\`\\`\\`typescript\nconst ap = await Networking.Wifi.GetCurrent();\nprintln(ap ? \\`Connected: \\${ap.ssid}\\` : \"Offline\");\n\\`\\`\\`\n\n### Disconnect\n\nReturns \\`false\\` when there was no connection to drop.\n\n\\`\\`\\`typescript\nawait Networking.Wifi.Disconnect();\n\\`\\`\\`","d9a614c3-5fae-4a78-b134-c3d4e5f60718":"### Lib - Crypto\n\nCryptographic utilities and password cracking.\n\n### Hashcat - Crack Wi-Fi Passwords\n\nDecrypt captured \\`.pcap\\` files to reveal Wi-Fi passwords.\n\n\\`\\`\\`typescript\nconst password = await Crypto.Hashcat.Decrypt(\"capture.pcap\");\nprintln(\\`Cracked: \\${password}\\`);\n\\`\\`\\`\n\nWith path options:\n\n\\`\\`\\`typescript\n// Resolve from a specific directory\nawait Crypto.Hashcat.Decrypt(\"capture.pcap\", { cwd: \"downloads\" });\n\n// Resolve from root\nawait Crypto.Hashcat.Decrypt(\"capture.pcap\", { absolute: true });\n\\`\\`\\`\n\n### Hash Utilities\n\n\\`\\`\\`typescript\n// Generate MD5 hash\nconst hash = Crypto.Hash.md5(\"hello world\");\n\n// Encrypt a password (stores mapping for later decryption)\nconst encrypted = await Crypto.Hash.encrypt(\"mypassword\");\n\n// Decrypt a previously encrypted hash\nconst original = await Crypto.Hash.decrypt(encrypted);\nprintln(original); // \"mypassword\"\n\\`\\`\\`","e0b725d4-60bf-4b89-c245-d4e5f6071829":"### Lib - HackDB\n\nAccess the exploit database programmatically.\n\n### List All Exploits\n\n\\`\\`\\`typescript\nconst exploits = await HackDB.ListExploits();\nfor (const exploit of exploits) {\n  println(\\`\\${exploit.title} - \\${exploit.service} \\${exploit.version}\\`);\n}\n\\`\\`\\`\n\n### Search Exploits\n\n\\`\\`\\`typescript\nconst results = await HackDB.SearchExploits(\"ftp\");\nprintTable(results.map(e => ({\n  Title: e.title,\n  Service: e.service,\n  Version: e.version\n})));\n\\`\\`\\`\n\n### Download Exploit\n\n\\`\\`\\`typescript\n// Download to ~/downloads (default)\nawait HackDB.DownloadExploit(\"sqlmap\");\n\n// Download to a specific directory\nawait HackDB.DownloadExploit(\"wordlist\", \"tools\");\n\n// Download with absolute path\nawait HackDB.DownloadExploit(\"kimai\", \"/home/user/desktop\", {\n  absolute: true\n});\n\\`\\`\\`","f1c836e5-71c0-4c9a-d356-e5f60718293a":"### Lib - NTLM\n\nNTLM authentication attack library.\n\n### Check NTLM Service\n\nCheck if a target has NTLM authentication enabled.\n\n\\`\\`\\`typescript\nconst hasNtlm = await NTLM.Check(\"11.22.33.44\");\nif (!hasNtlm) throw \"No NTLM service found.\";\n\\`\\`\\`\n\n### Connect & Dump Hashes\n\n\\`\\`\\`typescript\nconst connection = await NTLM.Connect(\"11.22.33.44\");\nconst instance = await connection.GetInstance(\"2\"); // NTLM version\nawait instance.Dump(\"admin\"); // Dumps the user's NTLM hash\n\\`\\`\\`\n\n### Full Example\n\n\\`\\`\\`typescript\nconst ip = \"11.22.33.44\";\n\nif (await NTLM.Check(ip)) {\n  println(\"NTLM service found, connecting...\");\n  const conn = await NTLM.Connect(ip);\n  const ntlm = await conn.GetInstance(\"2\");\n  await ntlm.Dump(\"admin\");\n  println(\"NTLM hash dumped successfully.\");\n}\n\\`\\`\\`","30d96f0b-0d95-41eb-80fd-458dc898b123":"### What is Suspicion Level?\n\nSuspicion level, as the name suggests, indicates your level of suspicion in the game.\n\nBe careful what you do when hacking or baiting someone!","8903fa49-c146-49e0-8f2b-471581757c29":"### How does my level of Suspicion increase?\n\nYour level of suspicion in the game usually increases when you make an incomplete or incorrect action during the hacking phase or while sending phishing emails.\n\n### Hacking\n\n- When you access a system, you need to find the access logs.\n- Afterwards, you should delete the log stating that you have obtained a shell and not touch the other logs, otherwise the missing logs will be noticed by the system administrators.\n\n### Phishing Emails\n\n- When sending a phishing email, make sure you enter the data correctly or you will attract suspicion!","6c1612b7-79da-47a2-a44b-e3ef06581eb9":"### How to reduce Suspicion?\n\n- You can change your connected Wi-Fi network, this will change the IP and DNS address, which will reduce your suspicion level.","4f1ca3fc-3dbf-415d-b82e-d691c5fd3e4e":"### What happens at high levels of suspicion?\n\n- If your suspicion level is 50% or higher, there is a possibility that you can be hacked at any time. These hacks include mini games, if you succeed in these mini games, you will avoid the hack, if you fail, you will be penalized such as losing your money.\n- If the suspicion level reaches 100%, you will be seized by federal authorities and lose all your money.","87933a55-4941-4af2-a2b3-78e17f948f1c":"### Command: apt-get install\n\nInstalls terminal command package.\n\nUsage\n\n\\`apt-get install [package name]\\`","d0937d2f-e308-4c70-bfe7-7818e8e3b595":"### Command: bettercap\n\n  \n\nBettercap is a powerful, modular, and easily extensible framework designed for network attacks and monitoring.\n\n  \n\nInstallation\n\n\\`apt-get install bettercap\\`\n\n  \n\nStart\n\n\\`bettercap\\`\n\n  \n\nStart Probing\n\n\\`net.probe on\\`\n\n  \n\nShow network card list\n\n\\`net.show\\`\n\n  \n\nSet wi-fi recon to interface which monitoring mode is enabled\n\n\\`wifi.recon [interface]\\`\n\n  \n\nThen show wi-fi list\n\n\\`wifi.show\\`\n\n  \n\nSet target wi-fi\n\n\\`set wifi.ap [BSSID]\\`\n\n  \n\nSend deauthantication packets to target\n\n\\`wifi.deauth\\`\n\n  \n\nExit bettercap\n\n\\`exit\\`\n\n  \n\nInstall hashcat for decrypt hash\n\n\\`apt-get install hashcat\\`\n\n  \n\nCrack password\n\n\\`hashcat [pcap file]\\`","db39b439-462d-40cd-8801-24c2ef5c1492":"### Command: cat\n\n  \n\nReads file content.\n\n  \n\nUsage\n\n\\`cat [file name]\\`","74a3e952-75f6-4bf4-b486-e2b747ea63d6":"### Command: cd\n\n  \n\nThe cd command used to change the current working directory.\n\n  \n\nUsage\n\n\\`cd [directory name]\\`\n\n  \n\nTo go back or upper directory:\n\n\\`cd ..\\`","7fa8850d-e41b-4639-a9ab-d743d466dd38":"### Command: ftp\n\n  \n\nIt allows us to connect and manage the remote ftp server.\n\n  \n\nUsage\n\n\\`ftp -h [host] -u [user] -p [password]\\`","960466ca-acef-47f8-b1cd-c2c95be8b80b":"### Command: hydra\n\nHydra is a parallelized login cracker that supports numerous protocols.\n\n-   The \\`-u\\` flag is optional. If omitted, Hydra automatically uses **root** as the default username.    \n-   The \\`-T\\` flag specifies the target in the _IP:Port_ format.  \n    Example: \\`hydra -T 192.168.1.1:22 -P ./wordlist.lst\\`\n-   The \\`-P\\` flag is used to provide the path to your wordlist file. Make sure to specify the correct absolute or relative path.  \n    Example: if you're in the root directory and the file is inside **downloads**:  \n    \\`-P /downloads/wordlist.lst\\`\n  \n**Usage (default username: root):**  \n\\`hydra -T [ip:port] -P [wordlist]\\`\n\n**Usage (with username):**  \n\\`hydra -T [ip:port] -l [username] -P [wordlist]\\`","eca868d8-8ad9-40f3-b86c-d01df35897f9":"### Command: john\n\n  \n\njohn, meaning \"John The Ripper\", is used to crack the password of encrypted texts.\n\n  \n\nYou must install the package first.\n\n  \n\n\\`apt-get install john\\`\n\n  \n\njohn has 2 different uses.\n\n  \n\n- File password cracking\n\n\\`john /etc/passwd\\`\n\n  \n\n- Deciphering the hash string\n\n\\`john <hash>\\`\n\nExample\n\n\\`john 31435008693ce6976f45dedc5532e2c1\\`","de5e320b-7abf-43aa-a607-6be1662c8ac7":"### Command: ls\n\nThe ls command is used to list files. \"ls\" on its own lists all files in the current directory.\n\nUsage\n\\`ls\\`","28b3e126-d842-4dd5-b1ef-41612870eeb1":"### Command: lynx\n\n  \n\nIt performs a deep search on the Internet.\n\n  \n\nUsage\n\n\\`lynx [search]\\`","9a244b12-e471-46b0-89f3-f9d291af117c":"Creates a new directory in the current working path.\\n\\n`mkdir <directory name>`","8a7f1ee5-54d6-4c81-a2d0-67c37c433f70":"### Command: nmap\n\n  \n\nNmap is an open source tool used for network scanning and vulnerability detection.\n\n  \n\nYou can perform a more detailed scan using the -sV flag and learn about the services running in the background and their version information.\n\n  \n\nDefault usage\n\n\\`nmap [ip address]\\`\n\n  \n\nFor detailed usage\n\n\\`nmap [ip address] -sV\\`\n\n  \n\nFor specific port\n\n\\`nmap [ip address] -port [port number]\\`\n\n  \n\n### Example Usage\n\n  \n\nLet's take the IP address 10.22.33.44 as an example.\n\n  \n\nLet's list the ports on this address.\n\n\\`nmap 10.22.33.44\\`\n\nThe output we will get:\n\n| PORT | STATE | SERVICE |\n| ---- | ----- | ------- |\n| 21 | OPEN | ftp |\n| 22 | CLOSE | ssh |\n| 80 | CLOSE | http |\n\n  \nSTATE:\n\n- OPEN: This port is defined and actively used.\n\n- CLOSE: These ports are defined but closed for use.\n\n- FORWARDED: The port is open, but it has been redirected to a different port instead of the default one. This means the service is still accessible, but through a different port number. For example, an FTP server normally runs on port 21, but if it appears as FORWARDED on port 37359, it means connections to 37359 are being forwarded to the actual FTP service running on port 21 inside the network.\n\n  \n\nSERVICE:\n\n- Service running on this port in the background.\n\n  \n\nWhen we did a more detailed search:\n\n  \n\n\\`nmap 10.22.33.44 -sV\\`\n\n  \n\nThe output we will get:\n\n  \n\n| PORT | STATE | SERVICE | VERSION | DESTINATION |\n| ---- | ----- | ------- | ------------- | ----------- |\n| 21 | OPEN | ftp | vsftpd 1.0.0 | 192.168.1.2 |\n| 22 | CLOSE | ssh | openssh 1.0.0 | 192.168.1.2 |\n| 80 | CLOSE | http | nginx 1.0.0 | 192.168.1.2 |\n  \nVERSION:\n\nThis section consists of 2 parts.\n\n- Part 1: Name of the running application.\n\n- Part 2: Version of this running application.\n\n  \n\nIf we know the running service version and the port is open, we can infiltrate this system.","76f65c2a-3d87-4ae0-a3f0-517fd57d1f35":"### Command: nslookup\n\n  \n\nFinds the IP address of the target domain.\n\n  \n\nUsage\n\n\\`nslookup [domain]\\`","92bb605f-1515-414c-9217-97d731ffb73f":"### Command: Nuclei\n\n<b>Nuclei</b> is a fast, customizable vulnerability scanner.\n\n\\`nuclei -h <hosts>\\`\n\nUsage\n\nTo use Nuclei, you need a text document containing domain addresses.\n\nExample:  /domain_list.txt\n\\`\\`\\`\nexample.com\ndomain.com\nmyanotherdomain.com\n\\`\\`\\`\n\nThen\n\n\\`nuclei -h /domain_list.txt\\`","ac067caa-30b2-4e71-8898-def998a7d4c6":"### Command: openssl\n\n  \n\nEncrypts or decrypts text.\n\n  \n\nUsage for encryption\n\n\\`openssl -enc [text]\\`\n\n  \n\nUsage for decryption\n\n\\`openssl -dec [text]\\`","5ad1efa6-e65d-4e7c-9aa7-2632548699f9":"### Command: ping\n\n  \n\nIt checks whether it successfully sent a packet to the server and whether it received a response.\n\n  \n\nUsage\n\n\\`ping [ip address]\\`","9294f51e-b050-45d2-ab54-4b17554145ff":"### Command: python3\n\n  \n\nThe **python3** command allows us to run a python script.\n\n  \n\nUsage\n\n\\`python3 [/destination/to/file]\\`\n\n  \n\nExample\n\n\\`python3 /downloads/net_tree.py\\`\n\n  \n\nYou can find python scripts to run on <b  style=\"color:lime\">hackdb.net</b>","604a3ec4-b72c-4ac7-8f3e-f6f8fcfdd759":"### Command: rm\n\n  \n\nDeletes file/folder.\n\n  \n\nUsage\n\n\\`rm [file/folder name]\\`","b2d4f8a1-6c3e-4f70-9a2b-1d5e7c9f0a3b":"### Command: mv\n\n  \n\nMove or rename files and directories.\n\n  \n\nUsage\n\n\\`mv <source> <destination>\\`","c3e5a9b2-7d4f-4081-8b3c-2e6f8d0a1b4c":"### Command: cp\n\n  \n\nCopy files and directories.\n\n  \n\nUsage\n\n\\`cp <source> <destination>\\`","bcd49def-a84a-438e-bb40-4d98f3c2c5e1":"### Command: ssh\n\n  \n\n- Secure Shell (SSH) is a protocol that provides a secure way to access a remote computer.\n\n- It allows you to remotely log in to a system and execute commands as if you were sitting at the console.\n\n- The important thing is flags.\n\n- In ssh we don't use common usage.\n\n- At -h flag you need to combine username and ip address (without port).\n\n- Example: root@192.168.1.1\n\n  \n\nUsage\n\n\\`ssh -h [username@ip] -p [port]\\`","120572cc-72c3-49ce-8741-5c864889890e":"### Command: subfinder\n\n<b>subfinder</b> is a subdomain discovery tool that returns valid subdomains for websites, using passive online sources. It has a simple, modular architecture and is optimized for speed. subfinder is built for doing one thing only - passive subdomain enumeration, and it does that very well.\n\n\\`subfinder -d <domain>\\`\n\nExamples\n\n\\`subfinder -d example.com\\`\n\\`subfinder -d https://example.com\\`","2a79260e-e6f9-4eba-b276-60561321647b":"### Command: sudo\n\n  \n\nIt allows you to switch to the \"root\" user, which is the highest authorized user in computer.\n\n  \n\nIf you want, switch directly to the root user or run a command with root authority.\n\n  \n\nSwitch root user\n\n\\`sudo -su\\`\n\n  \n\nRun command with root privileges\n\n\\`sudo [command]\\`\n\n  \n\nExample:\n\n\\`sudo apt-get install metasploit\\`","80644dd3-6258-4512-9c0b-5becd638a018":"### Command: whois\n\n  \n\nWith the Whois command, you can find the person who owns a domain, IP address or email address.\n\n  \n\nUsage\n\n\\`whois [domain/ip address/email]\\`","4381b0e2-5fc5-470a-b9ba-bbdaf9e07123":"### Command: node\n\nThis command allows you to run in-game scripts (with a .ts extension). It is not installed by default.\n\n\\`node myscript.ts\\`","50492ef2-2292-4932-b1b9-57b80ad226b5":"### Command: geoip\n\nGeoip is a well-known tool that helps you find the location of a given IP address.\n\n\\`geoip <ip address>\\`\n\nExample\n\\`geoip 46.20.15.34\\`","e64c8f13-353c-46e1-88bb-3b236b1c53e2":"### Command: mxlookup\n\nFinds mail server of domain.\n\n\\`mxlookup <domain>\\`\n\nExample\n\\`mxlookup example.com\\`","945d04e6-192d-4bcf-b35d-c3374728446b":"### Command: pip\n\nPip is a package manager for Python. It is required for installing programs written in Python.\n\nFor install\n\\`apt-get install pip\\`\n\nInstalling python package\n\\`pip install <package name>\\`\n\nExample\n\\`pip install sqlmap\\`","d5f74dc8-c3d0-4946-9011-c8f7a7b476d4":"### Command: weechat\n\nWeechat allows you to chat online completely anonymously using just your username. It's often used for darknet.\n\nUsage\n\\`weechat <ip address> <password>\\`","e6e3631e-2117-4c57-91d6-1cf1afc61ee8":"### Command: git\n\nGit is the platform where players store and share the programs they write.\n\n**Initialize Repository**\nFor example we're on folder that have scripts.\n\\`git init -n <repo name>\\`\n\n**Commit**\nAdd commit to repository.\n\\`git commit -m <message>\\`\n\n**Push**\nPush commit to repository.\n\\`git push\\`\n\n**Pull**\nPull latest updates on repository.\n\\`git pull\\`\n\n**Clone**\nClone repository.\n\\`git clone <repository slug> <path to clone>\\`\n\nExample\n\\`git clone example-hack-tool ./home/user/desktop/repo-folder\\`","b3f8a2c1-7d4e-4f59-8e6a-9c2d1f0e3b5a":"### Command: download\n\n  \n\nDownloads a file from the remote server to your local machine.\n\n  \n\nUsage\n\n\\`download <file path>\\`","94342578-d169-4397-b24b-804394651bb4":"### Command: dig\n\nDig is a command-line tool for gathering information about IP address.\n\n\\`dig <ip address>\\`","a7c3e1f0-4d82-4b9a-ae15-7f6d8c9b0e23":"### Command: dirhunter\n\nDirhunter is a web directory discovery tool. It scans a target website and reveals its publicly accessible paths and pages.\n\nUseful for reconnaissance - finding hidden admin panels, API endpoints, or forgotten pages on a target domain.\n\n**Install:**\n\\`apt-get install dirhunter\\`\n\n**Usage:**\n\\`dirhunter <domain>\\`\n\n**Example:**\n\\`dirhunter example.com\\`\n\nThe tool will scan the target and list all discovered directories and pages.","93a0add7-e11a-4ef0-8b4d-a75f8daabd55":"### Python Module: Sqlmap\n\nSqlmap is a tool for testing and exploiting SQL injection vulnerabilities.\n\nInstalling\n\\`pip install sqlmap\\`\n\nUsage\n\\`sqlmap -u <url> <options>\\` or \\`python3 sqlmap.py -u <url> <options>\\`\n\nList of available options\n- Listing tables: \\`sqlmap -u <url> -tables\\`\n- Dump table data: \\`sqlmap -u <url> -dump -table <table name>\\`\n\nExample usage <br>\nLet's say our target is bestecommerce.com and there is a SQL vulnerability.\n\n\\`sqlmap -u bestecommerce.com -tables\\`\n\nResult\n| Table name |\n| ---- |\n| Products |\n| Users |\n\nThen\n\\`sqlmap -u bestecommerce.com -dump -table Products\\`\n\nResult\n| Product ID | Product Name | Price |\n| ---- | ---- | ---- |\n| 1 | Phone | 499$\n| 2 | Computer | 999$","f69f5362-f1ec-4bea-a0f4-1061ff2f7fa0":"### Python Module: Evil-Rm\n\nConnect to a remote machine and execute a command.\n\nInstalling\n\\`pip install evil-rm\\`\n\nUsage\n\\`evil-rm -i <ip address> -u <username> -H <hash>\\`\n\n**Important**\nTo use Evil-RM, you need to know the username and password hash of a user on the target device. For this, we recommend reviewing NTLM tools.\n\nExample\n\\`evil-rm -i 47.189.132.4 -u alex -H 09bb63bf7635f9cfd50f022e7a3b0dba\\`\n","d64de3d4-a5f5-4392-9a68-4974e255aa05":"### Python Module: Net Tree\n\nThis exploit leverages an IP address as input to generate a complete network topology. Using active and passive scanning techniques, the tool identifies routers, switches, and connected devices, along with their open ports and services. The output is visualized using a tree-like structure for better readability.\n\nUsage\n- Download net_tree.py from hackdb.net.\n- Install python \\`apt-get install python3\\`\n- \\`python3 net_tree.py <ip address>\\`\n\nExample\n\\`python3 /home/user/downloads/net_tree.py 46.20.15.34\\`","e2c71671-50e6-4ed2-a7fb-dc129df1aa4d":"### Python Module: Kimai\n\nKimai is vulnerable to SameSite-Cookie-Vulnerability-session-hijacking. The attacker can trick the victim to update or upgrade the system, by using a very malicious exploit to steal his vulnerable cookie and get control of his session.\n\nKimai is known to be effective on firewalls.\n\nUsage\n- Download kimai.py from hackdb.net.\n- Install python \\`apt-get install python3\\`\n- Start listening on Wireshark.\n- \\`python3 kimai.py <ip address>\\`\n- Kimai may not be able to steal a cookie 100% of the time. If you can't get a cookie, try again.\n\nExample\n\\`python3 /home/user/downloads/kimai.py 46.20.15.34\\`","9d4fd1d0-5743-4190-8ebc-33cca9d62ba4":"### Python Module: JWT Decoder\n\nThis exploit decodes JWT tokens and manipulates their payload to bypass security and escalate privileges. It's commonly used to exploit weak or absent JWT signature validation mechanisms.\n\nUsage\n- Download jwt_decoder.py from hackdb.net.\n- Install python \\`apt-get install python3\\`\n- \\`python3 jwt_decoder.py <jwt token>\\`\n\nExample\n\\`python3 /home/user/downloads/jwt_decoder.py eyJ...\\`","bf6abbce-e300-4ca0-b3fe-ae7904d372be":"### Python Module: WigleNet\n\nWigleNet is a tool to find all devices in a specific location.\n\nUsage\n- Download wiglenet.py from hackdb.net.\n- Install python \\`apt-get install python3\\`\n- \\`python3 wiglenet.py -lat <latitude> -long <longitude>\\`\n\nExample\n\\`python3 /home/user/downloads/wiglenet.py -lat 145.06 -long 68.592\\`","872b0296-c4fd-49b4-8e77-c1e711caf381":"### Python Module: Pret\n\nPRET is a new tool for printer security testing developed in the scope of a Master's Thesis at Ruhr University Bochum. It connects to a device via network or USB and exploits the features of a given printer language.\n\nUsage\n- Download pret.py from hackdb.net.\n- Install python \\`apt-get install python3\\`\n- \\`python3 pret.py <ip address>\\`\n\nExample\n\\`python3 /home/user/downloads/pret.py 46.20.15.34\\`\n\n**Important**\n- PRET requires the printer to be reachable via its LAN IP address with port 9100 (RAW printing) open. If port 9100 is closed, PRET cannot communicate with the printer.","37e141cf-a63d-41c5-b09f-6184a867c0b6":"### Python Module: Fern\n\nA tool for cracking router passwords if the router model is publicly available.\n\nUsage\n- Download fern.py from hackdb.net.\n- Install python \\`apt-get install python3\\`\n- \\`python3 fern.py\\`\n- Enter router model.\n\nExample\n\\`python3 /home/user/downloads/fern.py\\`\n\\`Router Model > WN087A2\\`","0163784c-4ca7-4604-92cc-458968826437":"### Python Module: pyUserEnum\n\npyUserEnum is a tool for enumerate users on a subnet.\n\nUsage\n- Download pyUserEnum.py from hackdb.net.\n- Install python \\`apt-get install python3\\`\n- \\`python3 pyUserEnum.py <ip address>\\`\n\nExample\n\\`python3 /home/user/downloads/pyUserEnum.py 46.20.15.34\\`","ow-intro":"## The Online World\n\nMultiplayer is one big world that everyone shares. Every company site, home network, and person you see is a live target, and other operators (plus automated NPC crews) are working the same boxes at the same time as you.\n\nA few things follow from that:\n\n- **Loot runs out.** When a target gets robbed its loot is used up, and the box goes on a cooldown (usually a couple of hours) before it fills back up. If a box looks empty, come back later or move on to another one.\n- **The world keeps moving while you are away.** NPC crews farm targets on their own, so the fat score you were saving can be gone by the time you reach it. Open the Network Monitor to see who is active on the wire.\n- **Targets are not frozen.** A box you cracked last week will not look the same forever. Its open services can shift between raids, so scan it fresh every time instead of trusting the old way in.\n\nThe rest of this section walks the whole loop: find a target, break in, grab the loot, and turn it into clean money without getting caught.\n","ow-recon":"## Finding Targets\n\nYou can only attack something you can reach, and you reach a box by its **IP address**. Recon is simply the work of turning a name into an IP.\n\nThree commands do most of the job:\n\n- \\`nslookup <domain>\\` resolves a domain to an address. For a plain machine, that address is the box itself.\n- \\`whois <domain>\\` shows who owns a domain, plus contact and mail hints that help later when you phish.\n- \\`mxlookup <domain>\\` resolves the **mail** server. Mail almost never hides behind a CDN, so this is a dependable way to leak a real address.\n\nTip: \\`whois <IP>\\` looks up the person or machine using that address, while \\`whois <domain>\\` looks up the company that owns the name. If a name surprises you, that is why.\n\n### When a target hides behind a CDN\n\nSometimes \\`nslookup\\` says the host is behind Cloudfire and the origin is hidden. That means the address you got is only the CDN edge, and the edge cannot be exploited. You have two ways around it.\n\n**The mail record.** Mail is usually not proxied:\n\n\\`\\`\\`\nmxlookup targetcorp.com\n\\`\\`\\`\n\n**Passive DNS.** A CDN can hide what a name resolves to today, but it cannot unpublish what the name already leaked. Every address the domain was seen on before it went behind the proxy stays on the record:\n\n\\`\\`\\`\ndnshistory targetcorp.com\n\\`\\`\\`\n\nEither one hands you the real **origin IP** to scan and exploit. If a zone was proxied from its very first record it has no history at all, which means that owner set it up properly and you need another angle.\n\n### Reputation opens doors\n\nHigher-value targets stay out of reach until you have built a name. Reputation climbs as you pull off jobs, and the bigger the payout, the more reputation a target expects before it will even respond. Start small and work your way up.\n","ow-tiers":"## Targets & Tiers\n\nNot every target is equally hard. Boxes come in tiers, and the tier tells you how much work getting in will take.\n\n- **Tier 1, direct.** Reachable straight from the internet. Scan the IP, find the open service, exploit it. Great for building reputation and starter cash. See *Tier 1: Direct Targets*.\n- **Tier 2, VPN gated.** You cannot touch the real box from outside. First you get a VPN certificate (by phishing an employee or by cracking a captured hash), connect with \\`openvpn\\`, and only then can you exploit the target. See *Tier 2: VPN-Gated Targets*.\n- **Tier 3, vaults.** Hidden targets that never appear until something leaks a lead. The prize sits deep inside a private network, so you breach the edge host and then **pivot** hop by hop toward the vault at the core. See *Tier 3: Vaults*.\n\nHigher tiers pay far more, raise heat faster, and often need reputation before the target answers at all. Climb steadily; do not expect to walk into a vault on day one.\n\nEach tier has its own walkthrough in this section, and *Operator Commands* lists every command the online world adds.\n","ow-tier1":"## Tier 1: Direct Targets\n\nA Tier 1 box answers the open internet. There is no gate: if you can resolve its address, you can attack it. This is where you learn the loop and build the reputation the higher tiers ask for.\n\n### The full run\n\n**1. Pick a target.** Browse the directory or the Network Monitor, or follow a domain you turned up while digging.\n\n**2. Resolve it.**\n\n\\`\\`\\`\nnslookup targetcorp.com\n\\`\\`\\`\n\nIf the answer says the host sits behind Cloudfire, that address is only the CDN edge and cannot be exploited. Take the real origin off the mail record or the passive-DNS history instead:\n\n\\`\\`\\`\nmxlookup targetcorp.com\ndnshistory targetcorp.com\n\\`\\`\\`\n\n**3. Map the surface.**\n\n\\`\\`\\`\nnmap 203.0.113.5\n\\`\\`\\`\n\n**4. Sort the real doors from the traps.**\n\n\\`\\`\\`\nprobe 203.0.113.5\n\\`\\`\\`\n\nOnly swing at a port marked **EXPOSED**. A **hardened** port is a dead end that costs you trace, and a **HONEYPOT** will get you caught. \\`probe\\` also tells you the attack style: a direct port exploit, or a reverse shell where you set LHOST and LPORT yourself.\n\n**5. Exploit it.** Open \\`msfconsole\\`, select the module for that service, set the options \\`probe\\` pointed you at, and run it. The *Metasploit* section has the exact syntax.\n\n**6. Take the loot.** Find the data package on the box and download it. The transfer moves the file rather than copying it, so once it lands on your machine nobody else can take that score.\n\n**7. Cover your tracks before you leave.**\n\n\\`\\`\\`\nclearlogs targetcorp.com\n\\`\\`\\`\n\nThe breach writes your public IP into the host's access log. Leaving it there feeds the defender's forensics and raises your heat.\n\n**8. Cash out.**\n\n\\`\\`\\`\nappraise loot.dump\n\\`\\`\\`\n\nThen launder it or sell it. See *Appraising Loot* and *Cashing Out*.\n\n### What to expect\n\nTier 1 pays the least and is the quietest on your heat, which is exactly why it is the right place to grind reputation. The exploitable service is rolled per target and re-rolls when the box refreshes, so never assume last week's way in still works. Scan fresh every time.\n","ow-tier2":"## Tier 2: VPN-Gated Targets\n\nA Tier 2 company does not expose the box that holds the money. From outside you see the website and little else, and the exploit is refused until you are inside the corporate network. Getting inside means holding a **VPN certificate** for that specific company.\n\n### Step 1: Get a certificate\n\nTwo paths, and either one works.\n\n**Phish an employee.** Recon the company for a named staff member: \\`whois\\`, the site's about and contact pages, and \\`mxlookup\\` for the mail domain all help. Send them a booby-trapped document, and when they open it you land a shell on their workstation. Their machine holds the corporate \\`.ovpn\\` config; download it.\n\n**Crack a captured hash.** If you already pulled a password hash, from a \\`sqlmap\\` users dump on the public site or out of a phished inbox, forge it into a certificate:\n\n\\`\\`\\`\ncrack targetcorp.com\n\\`\\`\\`\n\nThe crack runs on a real clock scaled by tier and the server enforces the wait, so start it and go do something else. It drops a cert file when it finishes.\n\n### Step 2: Bring the tunnel up\n\n\\`\\`\\`\nopenvpn corp-vpn.ovpn targetcorp.com\n\\`\\`\\`\n\nThe tunnel belongs to **the terminal that opened it**. That terminal is now busy holding the line, so open a second one and work from there. Close the first and the tunnel drops.\n\n### Step 3: Work the box from inside\n\nNow the target answers. Run the Tier 1 routine, but from inside the tunnel:\n\n\\`\\`\\`\nnmap 203.0.113.5\nprobe 203.0.113.5\n\\`\\`\\`\n\nExploit the exposed service, take the package, and run \\`clearlogs\\` before you let the tunnel go.\n\n### Things that bite people\n\n- A cert is bound to **one instance** of the target. Once the box is looted and rotates, the old cert is dead and you need a fresh one.\n- A stolen cert opens **that company only**. It is not a skeleton key for other targets.\n- A **generic cert** bought on the GreyMarket works on any matching target but is used up on the first connection.\n- Tier 2 raises heat noticeably faster than Tier 1. Rent proxy hops before you make a habit of it.\n","ow-tier3":"## Tier 3: Vaults\n\nTier 3 is the top of the ladder: a private vault behind a corporate edge, holding encrypted loot worth more than everything below it put together. Nothing about it is automatic. You need reputation, two different keys, a pivot through the internal network, and a decoder on the way out.\n\n### Step 0: Find it\n\nVaults are **not public**. They never show up in the directory and you cannot stumble onto one by scanning. You surface a vault by working the tier below it:\n\n- **Loot leaks a lead.** Some targets carry a pointer to a hidden one. Rob them and the vault appears in your directory and network view.\n- **Intel leaks a lead.** Pivot onto an internal NPC box and download the intel file sitting on it. That surfaces the lowest-tier hidden target you have not found yet, so the ladder unlocks roughly in order.\n\n### Step 1: Have the reputation\n\nA vault checks your name before it answers at all. If it tells you the target is out of your league, the number in the refusal is what you still have to earn on smaller jobs.\n\n### Step 2: Both keys, both appraised\n\nA vault wants two things at once:\n\n- a **vault VPN certificate**, and\n- a **vault access token**.\n\nBoth drop from raids or trade in the GreyMarket black market. A key that comes out of a raid arrives encrypted, and an encrypted key gets rejected, so appraise each one before you rely on it:\n\n\\`\\`\\`\nappraise vault-token.key\n\\`\\`\\`\n\n### Step 3: Tunnel in, then arm the auxiliary\n\n\\`\\`\\`\nopenvpn vault-vpn.ovpn vaultcorp.com\n\\`\\`\\`\n\nFrom a second terminal, hand the token to the target's metasploit access auxiliary:\n\n\\`\\`\\`\nauthkey vault-token.key vaultcorp.com\n\\`\\`\\`\n\nThe exploit stays refused until that auxiliary is armed. The token is single-use, but it is only spent once a foothold actually lands, so getting caught by a trace does not waste it.\n\n### Step 4: Breach the edge, then pivot\n\nExploit the edge host the usual way, then start working inward:\n\n\\`\\`\\`\npivot vaultcorp.com\n\\`\\`\\`\n\nThat lists the **frontier**: the hosts reachable from where you are standing. **Only one of them is real.** The others are dead ends that cost you trace for touching them. Hosts you have already captured leak config and log lines, and reading those is the only honest hint about which candidate opens the next layer.\n\nHop onto the one you picked:\n\n\\`\\`\\`\npivot vaultcorp.com dbnode01\n\\`\\`\\`\n\nA correct hop opens the next layer and drops loot: cheap decoy packages on the way in, the real vault at the core. After every single hop:\n\n\\`\\`\\`\nclearlogs vaultcorp.com\n\\`\\`\\`\n\n### Step 5: Get out and unscramble it\n\nVault loot exfiltrates **encrypted** and is worth nothing until it is decoded. You need a decoder matching the vault's scheme, from a raid drop or the black market:\n\n\\`\\`\\`\ndecode vault.dump vault-aes.dec\n\\`\\`\\`\n\nThen appraise it and fence it like anything else.\n\n### Things that bite people\n\n- Skipping \\`clearlogs\\` between hops stacks trace fast, and a vault run is long enough for it to add up.\n- Poking frontier hosts at random is the most common way to get traced on a vault. Read the leaked config first.\n- Line up the decoder **before** the run if you can. Sitting on undecodable loot while your heat is high is expensive.\n","ow-breach":"## Breaking In\n\nOnce you have a reachable IP, the break-in is a short routine.\n\n**1. Scan the box.** See what is listening:\n\n\\`\\`\\`\nnmap 203.0.113.5\n\\`\\`\\`\n\n**2. Probe before you swing.** Not every open port is a real door. \\`probe\\` sorts them for you:\n\n\\`\\`\\`\nprobe 203.0.113.5\n\\`\\`\\`\n\n- **exposed** ports are genuine, exploitable services.\n- **decoys** look open but lead nowhere. Poking one wastes time and adds a little trace.\n- **honeypots** are traps. Hitting one spikes your trace hard and can get you caught, so leave them alone.\n\n**3. Exploit the real service.** Open Metasploit, aim it at the exposed port, and run the matching exploit to land a shell. The *Metasploit* section covers the exact commands.\n\nThe exploitable service is randomized per target, so let \\`probe\\` tell you which port is real rather than assuming it is always the same one.\n","ow-vpn":"## VPN Certificates\n\nTier 2 boxes do not answer the open internet. You have to be inside the company network first, and that means holding a valid **VPN certificate** for that specific target. This page covers the certificates themselves; *Tier 2: VPN-Gated Targets* walks the whole job start to finish.\n\nThere are two ways to get one.\n\n**Phish an employee.** Find a staff member (recon and the company site help here), send them a booby-trapped mail, and when they bite you land on their workstation. From there you can download the company **VPN config file** to your machine.\n\n**Crack a captured hash.** If you pulled a password hash (from a \\`sqlmap\\` users dump or a phished inbox), turn it into a certificate:\n\n\\`\\`\\`\ncrack targetcorp.com\n\\`\\`\\`\n\nCracking takes real time based on the tier, so start it and let it run.\n\nWith a cert in hand, bring the tunnel up:\n\n\\`\\`\\`\nopenvpn corp-vpn.ovpn targetcorp.com\n\\`\\`\\`\n\nA few things worth knowing about the tunnel:\n\n- It is **tied to the terminal** that opened it. Close that terminal and the tunnel drops, so keep this one holding the line and work from another terminal.\n- A cert is bound to **one instance of the target**. It keeps working for as long as that box stays put, but the moment the target is looted and rotates, the old cert stops working and you need a fresh one.\n- A stolen cert only opens the company you took it from. It is not a skeleton key for other targets.\n","ow-keys":"## Keys & Decoders\n\nBeyond VPN certs, two kinds of tools open doors and unlock loot.\n\n**Access keys** get you into gated targets, and they come in two flavors:\n\n- **VPN certificates** ride a tunnel up. Use them with \\`openvpn\\`:\n\n\\`\\`\\`\nopenvpn <file> <target>\n\\`\\`\\`\n\n- **Access tokens** authenticate you straight to a service. Use them with \\`authkey\\`:\n\n\\`\\`\\`\nauthkey <file> <target>\n\\`\\`\\`\n\nEvery key is stamped with the tier it unlocks, so a Tier 2 key opens Tier 2 doors.\n\n**Decoders** unscramble encrypted loot. Each decoder matches one scheme, and you feed it to \\`decode\\` (see *Encrypted Loot*).\n\n### Where tools come from\n\n- **Raids.** Keys and decoders sometimes drop as bonus loot alongside a heist.\n- **The GreyMarket black market.** Once unlocked you can buy the exact key or decoder you need and sell the spares you pull. See *The GreyMarket*.\n\nOne note on bought certificates: a **generic cert** is a clean, ready-made certificate from the market rather than one you stole. It works on any matching target and arrives already identified, but it is used up on the first connection, so treat it as a convenience rather than a permanent key.\n","ow-pivot":"## Vaults & Pivoting\n\nTier 3 targets keep the real prize on an internal network you cannot see from outside. You breach the edge host like any other box, then work inward one layer at a time. That is **pivoting**.\n\nList the hosts you can currently reach from your foothold:\n\n\\`\\`\\`\npivot targetcorp.com\n\\`\\`\\`\n\nEach layer shows a short **frontier** of candidate hosts, but **only one of them is actually exploitable**. The rest are dead ends that cost you trace if you poke them. Captured hosts leak config and log lines, so read those hints to work out which candidate is the real one.\n\nHop onto the host you picked:\n\n\\`\\`\\`\npivot targetcorp.com dbnode01\n\\`\\`\\`\n\nThe right host opens the next layer and drops loot: cheap decoy scores on the way in, and the encrypted vault at the core. After every hop, cover your tracks:\n\n\\`\\`\\`\nclearlogs\n\\`\\`\\`\n\nKeep going until you reach the core, then loot the vault and get out.\n","ow-loot":"## Loot Packages\n\nWhat you steal comes out as an **opaque data package**: a raw dump with a realistic name like \\`backup.sql.gz\\`, \\`users_dump.sql\\`, or \\`wallet.keystore\\`. There is no viewer for it and you cannot open it. Double-clicking just tells you it is an encrypted package.\n\nThat is on purpose. A raw dump does not advertise its worth. Two things can be true of a package:\n\n- **Un-appraised.** You do not know what it is worth yet. Appraise it (see *Appraising Loot*).\n- **Encrypted.** It is scrambled and has to be decoded first (see *Encrypted Loot*).\n\nMoving a package to your machine is a **transfer, not a copy**. Once you pull it, it is gone from the box, so nobody else can grab that same loot.\n","ow-appraise":"## Appraising Loot\n\nA fresh package is a mystery until you look inside. From a terminal:\n\n\\`\\`\\`\nappraise <file>\n\\`\\`\\`\n\nAppraising reveals the package **type and real value**, and rewrites the file so you can read what you actually pulled (a preview of the records, config, keys, and so on). Only then does it carry a price you can act on.\n\nUn-appraised loot cannot be sold or laundered for its true value, so appraise first, then cash out.\n","ow-decode":"## Encrypted Loot\n\nSome packages come out **encrypted**, because hardened targets ship their crown jewels scrambled. An encrypted package cannot be appraised for full value or fenced until you decrypt it.\n\nYou need a matching **decoder** for the package scheme. Decoders drop as bonus loot from raids and trade on the GreyMarket black market. With one in hand:\n\n\\`\\`\\`\ndecode <file> <decoder>\n\\`\\`\\`\n\nOnce it is decoded, appraise it and fence it like any other package.\n","ow-fence":"## Cashing Out\n\nLoot is not money until you move it. Raw packages are **hot** (traceable), so you launder or sell them instead of depositing them directly.\n\n- **Bank and financial loot** (checks, wire logs) gets **laundered**. A cut is taken, and the cut grows while your heat is high.\n- **Data loot** (database dumps, credentials, wallets) gets **sold** on the GreyMarket. List it yourself, or let an NPC broker snap up fairly-priced listings that have sat for a while.\n\nThe two pay in different money. Laundering puts dollars in your bank; a GreyMarket sale pays **฿** into your market balance, which buys tools on the market but converts back to dollars at a terrible rate. Always appraise before you list, because an un-appraised package fences for nothing.\n","ow-market":"## The GreyMarket\n\n\\`greymarket.net\\` is where operators trade. It runs on its own currency, **฿**, and has three rooms.\n\n### ฿ and your bank are not the same money\n\nEverything on GreyMarket is priced in ฿. Selling pays ฿ into your market balance, and every purchase here spends it. Your LCB bank account is never touched, and there is no way to put dollars in.\n\nThe balance pill in the top right opens **cash out**, the only way to move ฿ into your bank. The street rate is savage: ฿1,000 lands about $6. That is the point. ฿ is worth its face value as long as it stays on the market, and almost nothing once it leaves, so the smart play is to reinvest it in tools rather than cash it out.\n\n### The flea market\n\nThe open floor is player to player. Hit **Sell an item**, pick a loot file from your own machine, and set a price. The dialog shows recent low, average, and high prices for that kind of item so you can price it sanely. Other operators buy your listings, and you can buy theirs. Selling hands the file to the buyer and removes it from your machine. If nobody bites, an NPC broker may eventually clear a fairly-priced listing so the floor keeps moving.\n\n**Listing slots.** You start with room for **3** live listings. Slots are earned by trading: every time your lifetime ฿ turnover crosses the next threshold, the market trusts you with one more. The counter under the toolbar shows how far off the next one is.\n\n### The exploit trader\n\nA rotating shelf of basic \\`.exp\\` files, restocked on a timer. Mostly common, some uncommon, the occasional single-stock rare. It never carries epic or legendary, because those only ever drop from Tier 3 loot.\n\n### The black market\n\nA locked back room for **access keys and decoders**. Getting in costs a one-time **฿16,667** out of your market balance, so it is a gate you can only reach by actually trading. Once it is unlocked you can:\n\n- **Buy tools** from a catalog: the exact key or decoder you need for a target, priced by tier.\n- **Sell tools** you looted or no longer need, fenced back for ฿ at a flat haircut.\n\nBought tools arrive already identified and land in your downloads, ready to use.\n","ow-heat":"## Heat & Hot Loot\n\nEvery heist raises your **heat**. Heat is the world remembering how loud you have been.\n\n- Freshly stolen loot is **hot**. Handling it while your heat is high costs you more: a bigger laundering cut and worse fences.\n- Heat cools on its own over time. If a job feels expensive to cash out, lie low and let it fall.\n- Bigger scores and hardened targets raise heat faster but pay far more. That is the trade you are making.\n\nStack too much heat and the wire turns dangerous: other operators watching a box can catch you on the way out. Balance greed against exposure.\n","ow-trace":"## Getting Traced\n\nEvery noisy move raises a **trace** meter on the job you are running: poking decoys, tripping a honeypot, or lingering too long on a box. Let the meter fill and you get **traced**.\n\nWhen that happens the run is burned on the spot: the connection drops, that target locks you out for a while, and your heat goes up.\n\nHow to stay clean:\n\n- Trust \\`probe\\` and do not swing at decoys or honeypots.\n- Run \\`clearlogs\\` after you work a host, especially while pivoting.\n- Rent proxy hops to soak up heat and trace (see *Proxies & Rigs*).\n- If a job is getting hot, back out and let things settle instead of pushing your luck.\n","ow-gear":"## Proxies & Rigs\n\nTwo upgrades quietly make every job safer and faster. Both are sold under **Upgrades** in the Black Market back room on \\`greymarket.net\\`, and both are paid for in ฿ you earned on the trading floor.\n\n**Proxy hops.** Each rented hop routes your traffic through another relay, which lowers the heat you pick up per job. More hops means a quieter footprint, and it is your main defense if you plan to hit big targets often.\n\n**Rig tier.** Upgrading your rig makes hacks and downloads run faster. Higher tiers shorten the slow parts of a raid, like cracking and exfiltrating, which matters when loot is contested and seconds count.\n\nSpend early profits here. A calmer, faster operator loses less loot to rivals and gets caught far less often.\n","ow-hosting":"## Your Own Infrastructure\n\nEverything you break into, you can also run yourself. Rent a box, rent a domain, serve a site from it, and you become a target like any company in this world. This page is the defending side of the manual.\n\n### Renting a box and a name\n\nHosting providers sell servers from their own dashboard, and registrars sell domains by the day or by the month. Both are prepaid for a fixed window: a lapsed rental stops serving, and a lapsed domain eventually goes back on the market, so renew from the dashboard before it does. You can pay out of your clean LCB balance or with a card, and a card you stole spends exactly as well as your own.\n\nWhere you buy the name matters, because \\`whois\\` reports it:\n\n- **Namecheep** is the cheapest and publishes your registrant record, so anyone who looks the domain up sees the contact details behind it.\n- **GoDiddy** costs more per day and includes WHOIS privacy on every domain it sells, so the same lookup comes back redacted.\n\nPrivacy hides who you are. It does nothing about where your box is, which is the next section.\n\n### Pointing the name at the box\n\nThe registrar and Cloudfire both give you a DNS manager for the names you own: A, CNAME, MX and TXT records. Point the apex (\\`@\\`) A record at your server's address and the site becomes browsable at that domain. Delete that record and the site goes dark.\n\n### Keeping your origin hidden\n\nSitting a name behind Cloudfire replaces the public answer with a CDN edge address. \\`nslookup\\` hands out the edge, \\`whois\\` reports no address at all, and the edge itself cannot be exploited. The protection is real, but it is only ever as good as your zone's history. Three rules:\n\n**1. Proxy the record from the very first save.** Cloudfire's add-a-site form does this for you. In a registrar's DNS panel the Proxied box starts unchecked, and saving your address that way, even once, even for a minute, is the most common way an origin gets leaked. The world records every address a name is seen on while it is unproxied, and \\`dnshistory yoursite.com\\` reads that record back forever. Switching the proxy on afterwards hides today's answer and unpublishes nothing. A zone proxied from its first record has no history at all, and that is the state you want. If you have already leaked an address, the only real fix is to move to a box with a new one and never publish it in the clear.\n\n**2. Every name in the zone counts.** A \\`dev\\` or \\`staging\\` record left unproxied gives away the same machine the apex would, and \\`subfinder\\` lists every name in your zone, so a forgotten one will be found.\n\n**3. Do not publish an MX that points at your own box.** Mail records cannot be proxied, and \\`mxlookup\\` reads the mail host's address straight out of your zone. That is how company origins get taken, and yours is no different.\n\n### Hardening what sits behind it\n\nCloudfire's Security tab sells defense layers per server, bought once each with clean funds:\n\n| Layer | What it does |\n| ---- | ---- |\n| Intrusion Detection (IDS) | Logs every attempt and alerts you. Does not block on its own. |\n| Network Firewall | Filters a service port off the open internet, sealing one path in. |\n| Web Application Firewall | Inspects web traffic and blocks exploits aimed at the web tier. |\n| Honeypot Trap | Plants a decoy service. Whoever attacks it is traced on the spot. |\n| Managed Auto-Patch | Keeps every service patched, so there is no exploitable weakness left. |\n| Smart Firewall (IPS) | One wrong move and the attacker's address is banned from the box for good. |\n\nThe same panel lists recent intrusions with the address each attempt came from, which is your early warning that somebody has found you.\n\nLayers are expensive on purpose, so buy for the box you have: a machine serving a site wants the web tier covered, a machine holding anything valuable wants Auto-Patch. And keep the order of operations straight. Hide the address first. A hardened box whose origin is sitting in passive DNS is only a slower target, not a safe one.\n","ow-egress":"## Working From a Rented Server\n\nEvery loud thing you do puts an address on the wire. It lands in the target's access log, in the surveillance feed of anyone watching that host, and in any per-address ban the box hands out. By default that address is your own machine's.\n\nA rented box changes it. Open a shell on a server you rent and, for as long as that shell is open, everything you launch leaves through it:\n\n\\`\\`\\`\nssh -h operator@203.0.113.5\n\\`\\`\\`\n\nFrom that moment the target sees the rented box's address instead of yours. Close the last shell and you are back on your own connection. Your own machine still reports its real address in \\`ifconfig\\`: only the work you launch from the server exits through the server.\n\n### Why it is worth the rent\n\n- **A ban hits the box, not you.** A Smart Firewall bans the address that made the wrong move, permanently. If that was a rental you burn the rental and take another one. If it was your own line, that target is closed to you for good.\n- **Surveillance names the box.** Operators watching a host see the source address of every attempt, so working through a rental keeps yours out of their capture.\n- **A line you forget to wipe points somewhere else.** \\`clearlogs\\` is still the habit to keep, but anything you miss names the rented box.\n\n### Practical detail\n\n- Hold as many shells as you like. You keep leaving through a box until the last one closes.\n- The routing lives with your session: a disconnect drops it, and it comes back with your shell.\n- A lapsed rental routes nothing. Renew before you lean on it.\n- Joining a foreign Wi-Fi network moves your address the same way. It is the cheap answer to a ban when you have no box to work from.\n\nKeep the box that serves your site separate from the box you work from. A site box has a domain pointing straight at it, which makes it the easiest address of yours for a rival to find, and that is the last address you want sitting in a victim's log.\n","ow-commands":"## Operator Commands\n\nThese commands exist only in the online world. Running one in singleplayer just tells you it is multiplayer only.\n\n### Recon and surveillance\n\n| Command | What it does |\n| ---- | ---- |\n| \\`probe <ip>\\` | Deep vuln scan. Classifies every port as exposed, hardened, or honeypot. Slower and louder than \\`nmap\\`. |\n| \\`dnshistory <domain>\\` | Passive DNS. Lists every address the domain was seen on, which is how you get behind a CDN. |\n| \\`watch <target>\\` | Start surveilling a target. |\n| \\`watch off <target>\\` | Stop surveilling it. |\n| \\`watch who <target>\\` | Sweep the target for other operators watching it. |\n\n\\`watch\\` puts a target on your wire: breach attempts and loot exfils on that host stream into the **Network Monitor** app, where you can start a capture to record them. Nothing is broadcast globally, so only operators who bothered to watch see the traffic. Run \\`watch who\\` on a box before you hit it to find out whether somebody is watching you back.\n\n### Access\n\n| Command | What it does |\n| ---- | ---- |\n| \\`crack <target>\\` | Turn a captured password hash into a VPN certificate. Runs on a real clock. |\n| \\`openvpn <cert> <target>\\` | Bring up the tunnel. Held by the terminal that opened it. |\n| \\`authkey <token> <target>\\` | Arm a vault's access auxiliary with an access token, before you run the exploit. |\n\n### Inside the network\n\n| Command | What it does |\n| ---- | ---- |\n| \\`pivot <target>\\` | List the frontier hosts you can reach from your foothold. |\n| \\`pivot <target> <host>\\` | Hop onto a host and open the next layer. |\n| \\`clearlogs <target>\\` | Wipe your IP out of that host's access log. Run it after every hop. |\n\n### Loot and money\n\n| Command | What it does |\n| ---- | ---- |\n| \\`appraise <file>\\` | Identify a package: reveals loot's real value, and unlocks a key or decoder for use. |\n| \\`decode <loot> <decoder>\\` | Decrypt encrypted loot with a matching decoder. Single-use. |\n| \\`launder <check>\\` | Run a stolen check through the Mixer into clean funds. The cut grows with your heat. |\n| \\`market\\` | List the black-market catalog. |\n| \\`market buy <id>\\` | Buy a listing with clean bank funds. |\n| \\`market sell <file>\\` | Sell a key or decoder you are holding. |\n\nOnly bank checks go through the Mixer. Data loot (dumps, credentials, wallets) is **sold** on \\`greymarket.net\\` instead. Either way, appraise it first: an unidentified package fences for nothing.\n\n### Leaving your mark\n\n| Command | What it does |\n| ---- | ---- |\n| \\`deface <message>\\` | Overwrite the homepage of the host you have a shell on. |\n\n\\`deface\\` only works from inside a shell on a target that actually serves a site. The write is persistent and global: every player who visits that homepage sees your message until the host resets on its own. It pays nothing, so it is pure reputation among operators.\n"},"ui":{"handbook":"Handbook","contents":"Contents","searchPh":"Search the handbook...","searchBtn":"Search","countN":"@n@ articles","noSel":"No content selected.","sub":"Guides and reference.","resultsN":"@n@ results for \"@s@\"","noRes":"No results for \"@s@\"","count":"@n@ articles","results":"@n@ results for \"@s@\""}};
const CAT_ORDER = ['Accounts','Digging','Metasploit','Scripting','Suspicion','Terminal','PythonModules','OnlineWorld'];
const CAT_ICONS = { Accounts:'👤', Digging:'⛏', Metasploit:'🛡', Scripting:'</>', Suspicion:'🎭', Terminal:'>_ ', PythonModules:'🐍', OnlineWorld:'🌐' };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function unescape2(s){
  return s.replace(/\\`/g,'`').replace(/\\\$/g,'$').replace(/\\\\n/g,'\n').replace(/\\n/g,'\n').replace(/\\\\/g,'\\');
}
const HTML_OK = /<\/?(?:span|b|i|em|strong)(?:\s+style\s*=\s*"[^"]*")?\s*\/?>|<br\s*\/?>/gi;
function md2html(md){
  const lines = md.split(/\r?\n/); let out=[],inCode=false,codeBuf=[],inList=false,para=[];
  const inline = t => { const keep=[];
    t = String(t).replace(HTML_OK, m => { keep.push(m); return '\u0001'+(keep.length-1)+'\u0001'; });
    let h = esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
    return h.replace(/\u0001(\d+)\u0001/g, (m,i)=>keep[+i]);
  };
  const flushPara=()=>{ if(para.length){ out.push('<p>'+para.map(inline).join(' ')+'</p>'); para=[]; } };
  for(const raw of lines){ const line=raw.trimEnd();
    if(line.startsWith('```')){ flushPara(); if(inCode){ out.push('<pre class="code">'+esc(codeBuf.join('\n'))+'</pre>'); codeBuf=[]; inCode=false; } else inCode=true; continue; }
    if(inCode){ codeBuf.push(raw); continue; }
    const h=line.match(/^(#{1,4})\s+(.*)/);
